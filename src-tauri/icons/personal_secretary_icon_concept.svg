<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 404) rotate(90) scale(620 620)">
      <stop stop-color="#1F232A"/>
      <stop offset="0.58" stop-color="#15181D"/>
      <stop offset="1" stop-color="#0D0F12"/>
    </radialGradient>
    <linearGradient id="bgEdge" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242A31" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#090A0D" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="orbitStroke" x1="258" y1="266" x2="768" y2="764" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CC3C6"/>
      <stop offset="0.42" stop-color="#D7E1E4"/>
      <stop offset="1" stop-color="#86A8AD"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="370" y1="280" x2="652" y2="726" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FAFC"/>
      <stop offset="1" stop-color="#CAD6DB"/>
    </linearGradient>
    <linearGradient id="lineAccent" x1="388" y1="370" x2="642" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D3D6"/>
      <stop offset="1" stop-color="#E7EEF1"/>
    </linearGradient>
    <filter id="shadow" x="124" y="124" width="776" height="776" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="22"/>
      <feGaussianBlur stdDeviation="28"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.00 0 0 0 0 0.00 0 0 0 0 0.00 0 0 0 0.40 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>
    <filter id="softGlow" x="206" y="210" width="612" height="612" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="356" y="286" width="312" height="452" rx="70"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="88" y="88" width="848" height="848" rx="220" fill="url(#bgGlow)"/>
    <rect x="88" y="88" width="848" height="848" rx="220" fill="url(#bgEdge)" fill-opacity="0.62"/>
    <rect x="104" y="104" width="816" height="816" rx="204" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  </g>

  <ellipse cx="512" cy="520" rx="226" ry="226" fill="#8FB2B5" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Orbit -->
  <circle cx="512" cy="512" r="240" stroke="url(#orbitStroke)" stroke-width="20" opacity="0.9"/>
  <circle cx="512" cy="512" r="240" stroke="#FFFFFF" stroke-width="2" opacity="0.12"/>

  <!-- Orbit node -->
  <g>
    <circle cx="713" cy="379" r="34" fill="#EAF1F4"/>
    <circle cx="713" cy="379" r="20" fill="#9FC5C8"/>
    <circle cx="713" cy="379" r="10" fill="#F8FBFC" opacity="0.86"/>
  </g>

  <!-- Center schedule card -->
  <g>
    <rect x="356" y="286" width="312" height="452" rx="70" fill="#111419" fill-opacity="0.72"/>
    <rect x="356" y="286" width="312" height="452" rx="70" stroke="url(#cardStroke)" stroke-width="18"/>
    <rect x="372" y="302" width="280" height="420" rx="54" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

    <!-- top notch / command header -->
    <rect x="432" y="340" width="160" height="24" rx="12" fill="#EAF1F4" opacity="0.95"/>
    <circle cx="404" cy="352" r="11" fill="#9FC5C8"/>

    <!-- schedule lines -->
    <rect x="404" y="410" width="216" height="32" rx="16" fill="url(#lineAccent)"/>
    <rect x="404" y="472" width="172" height="28" rx="14" fill="#E9F0F3" opacity="0.94"/>
    <rect x="404" y="530" width="230" height="28" rx="14" fill="#A5C6C8" opacity="0.95"/>
    <rect x="404" y="588" width="154" height="28" rx="14" fill="#E9F0F3" opacity="0.92"/>

    <!-- subtle right guide -->
    <rect x="610" y="404" width="16" height="228" rx="8" fill="#F4F8FA" opacity="0.9"/>

    <!-- version / carryover split marker -->
    <g opacity="0.95">
      <path d="M438 664C438 654.059 446.059 646 456 646H568C577.941 646 586 654.059 586 664V664C586 673.941 577.941 682 568 682H456C446.059 682 438 673.941 438 664V664Z" fill="#F0F5F7"/>
      <rect x="507" y="646" width="10" height="36" rx="5" fill="#111419" opacity="0.65"/>
    </g>
  </g>

  <!-- subtle diagonal analysis arc -->
  <path d="M336 628C386 690 448 726 512 736C602 750 686 711 732 648" stroke="#DDE7EA" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>

  <!-- inner ring highlight -->
  <circle cx="512" cy="512" r="196" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
